<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B5AF" />
      <stop offset="100%" stop-color="#087f7a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="5" filter="url(#shadow)" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Crescent & Star / Kaaba Icon -->
  <g transform="translate(100, 82) scale(0.95)" text-anchor="middle" fill="#ffffff">
    <!-- Plane icon -->
    <path d="M-5 -25 L5 -25 L8 -5 L28 8 L28 14 L8 6 L5 25 L12 30 L12 35 L0 32 L-12 35 L-12 30 L-5 25 L-8 6 L-28 14 L-28 8 L-8 -5 Z" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="100" y="140" text-anchor="middle" font-family="'Hind Siliguri', 'Inter', sans-serif" font-weight="700" font-size="18" fill="#ffffff" letter-spacing="1">ARAFA HAFIZ</text>
  <text x="100" y="158" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#e0f2fe" letter-spacing="2">LTD. B2B</text>
</svg>
